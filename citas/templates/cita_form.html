{% extends 'base.html' %}

{% block title %}{% if cita %}Editar Cita{% else %}Nueva Cita{% endif %} - Barbería{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2>
            <i class="bi bi-calendar-check"></i> 
            {% if cita %}Editar Cita{% else %}Nueva Cita{% endif %}
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning text-white">
                <h5 class="mb-0">Información de la Cita</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="cliente" class="form-label">Cliente</label>
                        <select class="form-select" id="cliente" name="cliente" required>
                            <option value="">Seleccione un cliente</option>
                            {% for cliente in clientes %}
                            <option value="{{ cliente.id_cliente }}" 
                                    {% if cita and cita.cliente_id == cliente.id_cliente %}selected{% endif %}>
                                {{ cliente.nombre }} {{ cliente.apellido }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="barbero" class="form-label">Barbero</label>
                        <select class="form-select" id="barbero" name="barbero" required>
                            <option value="">Seleccione un barbero</option>
                            {% for barbero in barberos %}
                            <option value="{{ barbero.id_barbero }}" 
                                    {% if cita and cita.barbero_id == barbero.id_barbero %}selected{% endif %}>
                                {{ barbero.nombre }} {{ barbero.apellido }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="servicio" class="form-label">Servicio</label>
                        <select class="form-select" id="servicio" name="servicio" required>
                            <option value="">Seleccione un servicio</option>
                            {% for servicio in servicios %}
                            <option value="{{ servicio.id_servicio }}" 
                                    {% if cita and cita.servicio_id == servicio.id_servicio %}selected{% endif %}>
                                {{ servicio.nombre }} - ${{ servicio.precio }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fecha" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fecha" name="fecha" 
                                   value="{% if cita %}{{ cita.fecha|date:'Y-m-d' }}{% endif %}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="hora" class="form-label">Hora</label>
                            <input type="time" class="form-control" id="hora" name="hora" 
                                   value="{% if cita %}{{ cita.hora|time:'H:i' }}{% endif %}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select class="form-select" id="estado" name="estado" required>
                            <option value="Pendiente" {% if cita and cita.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                            <option value="Completada" {% if cita and cita.estado == 'Completada' %}selected{% endif %}>Completada</option>
                            <option value="Cancelada" {% if cita and cita.estado == 'Cancelada' %}selected{% endif %}>Cancelada</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="observaciones" class="form-label">Observaciones</label>
                        <textarea class="form-control" id="observaciones" name="observaciones" rows="3">{% if cita %}{{ cita.observaciones }}{% endif %}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                        <a href="{% url 'cita_list' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
